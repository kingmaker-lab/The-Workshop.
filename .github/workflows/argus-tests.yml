name: ARGUS regression tests

on:
  push:
    paths:
      - "argus/**"
      - ".github/workflows/argus-tests.yml"
  pull_request:
    paths:
      - "argus/**"
      - ".github/workflows/argus-tests.yml"

permissions:
  contents: read

jobs:
  argus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: argus/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r argus/requirements.txt
      - name: Regression suite
        run: python -m unittest discover -s argus/tests -v
      - name: CLI smoke test
        run: |
          python -m argus.main analyze argus/samples/ssh_bruteforce.jsonl --db /tmp/argus-ci.db
          python -m argus.main timeline --db /tmp/argus-ci.db --limit 5
