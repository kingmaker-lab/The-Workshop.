name: Workshop Kids live smoke
on:
  push:
    branches: [main]
    paths:
      - "web/workshop-kids/**"
      - ".github/workflows/workshop-kids-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check homepage, Heart, Blade comic and Blade security chat
        run: |
          set -euo pipefail
          URL="https://workshop-kids.wolfpackworkshop.workers.dev"
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/" -o /tmp/home.html
          grep -q 'href="/heart/"' /tmp/home.html
          grep -q 'blade.webp?v=e04bfb99' /tmp/home.html
          grep -q 'heart.webp?v=00ff52e6' /tmp/home.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/jogar/" -o /tmp/game.html
          grep -q 'Missão dos Algoritmos' /tmp/game.html
          grep -q 'A Heart e a' /tmp/game.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/heart/" -o /tmp/heart.html
          grep -q 'Conversar com a Heart' /tmp/heart.html
          grep -q 'heart.webp?v=00ff52e6' /tmp/heart.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/blade/" -o /tmp/blade-comic.html
          grep -q 'O clique misterioso' /tmp/blade-comic.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/blade/conversar/" -o /tmp/blade-chat.html
          grep -q 'Converse com Blade' /tmp/blade-chat.html
          curl --connect-timeout 8 --max-time 25 -fsS "$URL/blade/chat.js" -o /tmp/blade-chat.js
          grep -q 'aiOptIn' /tmp/blade-chat.js
          curl --connect-timeout 8 --max-time 25 -fsS -X POST "$URL/api/blade" \
            -H 'Content-Type: application/json' -H "Origin: $URL" \
            --data '{"message":"O que é phishing?","band":"4-6","aiOptIn":false}' -o /tmp/blade-response.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/blade-response.json',encoding='utf8'))
          assert data['mode']=='guided' and data['category']=='phishing',data
          print('Blade comic + chat + guided API live: OK')
          PY

          curl --connect-timeout 8 --max-time 25 -fsS "$URL/heart.js" -o /tmp/heart.js
          grep -q 'aiOptIn' /tmp/heart.js
          curl --connect-timeout 8 --max-time 25 -fsS -X POST "$URL/api/heart" \
            -H 'Content-Type: application/json' -H "Origin: $URL" \
            --data '{"message":"Quero um desafio de lógica","band":"4-6"}' -o /tmp/kids-response.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/kids-response.json',encoding='utf8'))
          assert data['mode']=='guided' and data['category']=='quiz', 'guided API failed'
          print('Production paths and guided API OK')
          PY

          # Verify the three new Kids games and catalog without changing APIs.
          echo "Verify the three new Kids games"
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/jogos/" -o /tmp/kids-catalog.html
          grep -q 'Heart.s Robot Factory' /tmp/kids-catalog.html
          grep -q 'Blade: Cyber Guardian' /tmp/kids-catalog.html
          grep -q 'Mini Circuit Lab' /tmp/kids-catalog.html
          grep -q 'data-filter-age="4-6"' /tmp/kids-catalog.html
          grep -q 'data-filter-topic="safety"' /tmp/kids-catalog.html
          grep -q 'Detetive de Padrões' /tmp/kids-catalog.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/jogos/robot-factory/" -o /tmp/robot-factory.html
          grep -q 'id="robot-board"' /tmp/robot-factory.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/jogos/cyber-guardian/" -o /tmp/cyber-guardian.html
          grep -q 'id="guardian-choices"' /tmp/cyber-guardian.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/jogos/mini-circuit/" -o /tmp/mini-circuit.html
          grep -q 'id="circuit-battery"' /tmp/mini-circuit.html
          for asset in games.css access.js discovery.js robot.js guardian.js circuit.js; do
            curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/jogos/$asset" -o "/tmp/kids-$asset"
            test -s "/tmp/kids-$asset"
          done
          grep -q 'robotSim' /tmp/kids-robot.js
          grep -q 'guardianJudge' /tmp/kids-guardian.js
          grep -q 'circuitSim' /tmp/kids-circuit.js
          grep -q 'kidsCatalogMatches' /tmp/kids-discovery.js
          grep -q 'reading-mode' /tmp/kids-access.js
          echo "Game Lab + three interactive games live: OK"

          # Kids Create is now functional and stays on this Worker.
          echo "Kids Create frontend"
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/criar/" -o /tmp/kids-create.html
          grep -q 'id="pixel-board"' /tmp/kids-create.html
          grep -q 'id="story-text"' /tmp/kids-create.html
          grep -q 'id="invent-result"' /tmp/kids-create.html
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/criar/create.js" -o /tmp/kids-create.js
          curl --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 30 -fsS "$URL/criar/create.css" -o /tmp/kids-create.css
          grep -q 'PIXEL_SIZE=16' /tmp/kids-create.js
          grep -q 'buildStory' /tmp/kids-create.js
          grep -q 'buildInvention' /tmp/kids-create.js
          grep -q 'pixel-board' /tmp/kids-create.css
          echo "Kids Create live: OK"
