name: Workshop News ARGUS route safety

on:
  pull_request:
    paths:
      - "web/workshop-news/**"
      - ".github/workflows/workshop-news-argus.yml"
  push:
    paths:
      - "web/workshop-news/**"
      - ".github/workflows/workshop-news-argus.yml"

permissions:
  contents: read

jobs:
  safe-middleware:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/workshop-news/tests/news.test.mjs
