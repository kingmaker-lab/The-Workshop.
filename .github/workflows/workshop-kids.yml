name: Workshop Kids · jogo de lógica

on:
  push:
    paths:
      - 'web/workshop-kids/**'
      - '.github/workflows/workshop-kids.yml'
  pull_request:
    paths:
      - 'web/workshop-kids/**'
      - '.github/workflows/workshop-kids.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kids-game:
    name: Testar Heart e a Missão dos Algoritmos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar testes de rotas, segurança e soluções
        run: node --test web/workshop-kids/tests/*.test.mjs

      - name: Smoke HTTP do Heart no Worker de previa
        run: |
          set -euo pipefail
          URL="https://workshop-kids-heart-preview.wolfpackworkshop.workers.dev"
          curl --connect-timeout 8 --max-time 25 --retry 2 --retry-delay 2 -fsS "$URL/heart/" -o /tmp/heart-kids.html
          grep -q 'Conversar com Heart' /tmp/heart-kids.html
          curl --connect-timeout 8 --max-time 25 -fsS "$URL/jogar/" -o /tmp/heart-game.html
          grep -q 'Missão dos Algoritmos' /tmp/heart-game.html
          curl --connect-timeout 8 --max-time 25 -fsS -X POST "$URL/api/heart" \
            -H 'Content-Type: application/json' -H "Origin: $URL" \
            --data '{"message":"Quero um desafio de lógica","band":"4-6"}' -o /tmp/heart-chat.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/heart-chat.json'))
          assert data['mode']=='guided'
          assert data['category']=='quiz'
          print('Preview: Heart route, game and guided API OK')
          PY
          curl --connect-timeout 8 --max-time 45 -fsS -X POST "$URL/api/heart" \
            -H 'Content-Type: application/json' -H "Origin: $URL" \
            --data '{"message":"Como um robô usa sensores?","band":"10-12","aiOptIn":true}' -o /tmp/heart-liveai.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/heart-liveai.json'))
          assert data.get('mode') in ('ai','guided'), data
          print('AI response mode:', data['mode'], 'category:', data.get('category'))
          PY
