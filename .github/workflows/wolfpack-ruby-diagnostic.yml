name: DIAGNOSTIC Ruby WASM runtime v0.4.1
on:
  push:
    branches: [fix/wolfpack-ruby-worker-v041-20261019]
    paths: ['.github/workflows/wolfpack-ruby-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Compare CSP and bypass-CSP using actual Ruby mission execution
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for bypass in [False, True]:
              page=browser.new_page()
              page.set_default_timeout(20000)
              if bypass: page.set_bypass_csp(True)
              log=[]
              page.on('console',lambda m:log.append(('console',m.type,m.text[:400])))
              page.on('pageerror',lambda e:log.append(('pageerror',str(e)[:400])))
              page.on('requestfailed',lambda r:log.append(('failed',r.url[:200],r.failure)))
              page.on('worker',lambda w:log.append(('worker',w.url)))
              page.on('response',lambda r:log.append(('http',r.status,r.url[:200])) if 'ruby' in r.url or 'jsdelivr' in r.url else None)
              page.add_init_script("window.addEventListener('securitypolicyviolation',e=>console.error('CSP VIOLATION:',e.violatedDirective,e.blockedURI));")
              home=page.goto('https://wolfpack.wolfpackworkshop.workers.dev/?diagnose=wasm-test-v2',wait_until='domcontentloaded',timeout=30000)
              print('TEST',bypass,'HOME',home.status,'CSP',home.headers.get('content-security-policy','')[:900])
              page.locator('#code-editor').fill('puts "A matilha despertou!"')
              page.locator('#run-btn').click()
              if page.locator('#name-dialog').is_visible():
                page.locator('#codename-input').fill('RubyTester')
                page.locator('#save-name').click()
                page.locator('#run-btn').click()
              try:
                page.wait_for_function("""() => { const x=document.querySelector('#terminal-output')?.innerText||'';return x.includes('Erro ao carregar') || x.includes('APROVADO') || x.includes('PARABÉNS') || x.includes('PASSOU') || x.includes('SUCESSO') || x.includes('FALHOU') || x.includes('CONCLUÍDA') || x.includes('excedeu') || x.includes('fatal');}""",timeout=50000)
              except Exception as e:print('WAIT',str(e)[:120])
              page.wait_for_timeout(1800)
              print('OUTPUT',repr(page.locator('#terminal-output').inner_text()[:1200]))
              for event in log[-35:]:print('EVENT',event)
              page.close()
            browser.close()
          PY
