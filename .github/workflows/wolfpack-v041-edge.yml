name: WolfPack OS v0.4.1 release gate
on:
  push:
    branches: [main, feat/wolfpack-v041-full-release-20261019]
    paths:
      - 'web/wolfpack-os-v041-edge/**'
      - '.github/workflows/wolfpack-v041-edge.yml'
  pull_request:
    paths:
      - 'web/wolfpack-os-v041-edge/**'
      - '.github/workflows/wolfpack-v041-edge.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker syntax
        run: node --check web/wolfpack-os-v041-edge/worker.mjs
      - name: Asset and security contract tests
        run: node --test web/wolfpack-os-v041-edge/worker.test.mjs
