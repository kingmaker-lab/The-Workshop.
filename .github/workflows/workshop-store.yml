name: Workshop Store - validacao da vitrine

on:
  pull_request:
    paths:
      - "web/workshop-store/**"
      - ".github/workflows/workshop-store.yml"
  push:
    branches: [main]
    paths:
      - "web/workshop-store/**"
      - ".github/workflows/workshop-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checar sintaxe
        run: |
          node --check web/workshop-store/app.js
          node --check web/workshop-store/config.js
          node --check web/workshop-store/catalog.mjs
          node --check web/workshop-store/whatsapp.mjs
          node --check web/workshop-store/build.mjs
      - name: Compilar Worker independente
        run: |
          node web/workshop-store/build.mjs
          node --check web/workshop-store/dist/worker.mjs
      - name: Testar catalogo e orcamento via WhatsApp
        run: node --test web/workshop-store/tests/*.test.mjs
      - name: Conferir recursos essenciais
        run: |
          test -f web/workshop-store/index.html
          test -f web/workshop-store/styles.css
          test -f web/workshop-store/_headers
          grep -q 'Content-Security-Policy' web/workshop-store/_headers
