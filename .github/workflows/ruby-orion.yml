name: Ruby Orion Alnilam security and stability
on:
  push:
    branches: [main]
    paths:
      - 'Ruby/Ruby-Orion/**'
      - '.github/workflows/ruby-orion.yml'
  pull_request:
    paths:
      - 'Ruby/Ruby-Orion/**'
      - '.github/workflows/ruby-orion.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: '3.3'
          - os: ubuntu-latest
            ruby: '3.4'
          - os: windows-latest
            ruby: '3.4'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Ruby/Ruby-Orion
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Ruby syntax checks
        run: ruby -e 'Dir.glob("{lib,bin,labs,test}/**/*.rb").each { |f| abort("Syntax error: #{f}") unless system(RbConfig.ruby, "-c", f, out: File::NULL) }'
      - name: Minitest and integration tests
        run: ruby -Ilib -Itest -e 'Dir["test/test_*.rb"].sort.each { |file| require_relative file }'
      - name: CLI smoke tests
        run: |
          ruby bin/orion --version
          ruby bin/orion process run 002 --timeout 5 --json
          ruby bin/orion ipc demo --timeout 5 --json
      - name: Gem packaging
        run: gem build ruby-orion.gemspec
